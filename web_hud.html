<head data-page-node-id="2QE8Gl7Y87pHghyGsA8KEe">
  <meta charset="UTF-8" data-page-node-id="LHmq0VKurTzFAFhxeDRQ2e">

  <title>Workbuddy 桌面状态机 · 1:1 实体屏幕实时映射看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f12;
      color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }

    /* 模拟实战派外壳结构 */
    .device-shell {
      background: #1c2026;
      border: 4px solid #2d333d;
      border-radius: 28px;
      padding: 28px 24px 20px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .device-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #7b889b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .power-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .device-badge {
      font-size: 11px;
      color: #536279;
      background: #12151a;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid #262c36;
    }

    /* 物理屏幕 1:1 (320x240 @ 2x/3x 真实比例渲染) */
    .screen-container {
      width: 480px;
      height: 360px;
      background: #000000;
      border-radius: 12px;
      border: 3px solid #14171c;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 0 1px #2f3542;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 15px 18px;
    }

    /* 顶部 Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 24px;
    }
    .hud-logo {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .hud-model {
      max-width: 180px;
      margin-left: auto;
      margin-right: 10px;
      overflow: hidden;
      color: #00f2fe;
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(0, 242, 254, 0.1);
      border: 0.5px solid rgba(0, 242, 254, 0.25);
    }
    .hud-net-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #00e676;
      margin-top: 4px;
      padding-bottom: 2px;
    }
    .hud-net-row .rssi-tag {
      color: #00f2fe;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .hud-net-row .ip-tag {
      color: #7b889b;
    }
    .hud-time-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-time {
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #ffffff;
      font-weight: 600;
    }
    .hud-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7b889b;
      box-shadow: 0 0 6px currentColor;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 大卡片 / 状态区 */
    .hud-alert {
      display: flex;
      align-items: flex-start;
      margin-top: 18px;
      gap: 12px;
    }
    .hud-accent-bar {
      width: 5px;
      height: 48px;
      border-radius: 3px;
      background: #7b889b;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
      transition: background 0.3s ease;
    }
    .hud-alert-content {
      flex: 1;
    }
    .hud-state-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }
    .hud-alert-desc {
      font-size: 13px;
      color: #b0bac9;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-boot-prompt {
      color: #f59e0b;
      font-size: 13px;
      font-weight: bold;
      display: none;
    }

    /* 分割线与指标栏 */
    .hud-divider {
      height: 1px;
      background: #2b3543;
      margin: 18px 0 12px 0;
    }
    .hud-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
    }
    .metric-state {
      color: #7b889b;
      font-weight: 700;
      transition: color 0.3s ease;
    }
    .metric-duration {
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .metric-sync {
      color: #00f2fe;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* 当前任务时间线与翻滚轮播 */
    .hud-timeline-box {
      margin-top: 10px;
    }
    .hud-timeline-label {
      font-size: 12px;
      color: #7b889b;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-task-pager {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
      border: 0.5px solid rgba(0, 242, 254, 0.2);
    }
    .hud-task-roll {
      height: 24px;
      overflow: hidden;
      position: relative;
    }
    .hud-task-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
    .hud-task-title.roll-out {
      transform: translateY(-100%);
      opacity: 0;
    }
    .hud-task-title.roll-in {
      transform: translateY(100%);
      opacity: 0;
    }
    .hud-task-progress {
      font-size: 12px;
      color: #7b889b;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 底部实时状态条 */
    .device-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding: 0 4px;
    }
    .sync-badge {
      font-size: 12px;
      color: #00e676;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .sync-mode {
      font-size: 11px;
      color: #7b889b;
      background: #12151a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #262c36;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>

  <script>
    // 状态与色彩配置体系 (与 firmware/src/display_hud.cpp 100% 保持严格一致)
    const STATE_CONFIG = {
      'RUNNING': {
        text: '执行中',
        color: '#00f2fe'   // 亮青蓝 (RGB565: 0x07FA)
      },
      'COMPLETED': {
        text: '已完成',
        color: '#00e676'   // 亮绿色 (RGB565: 0x47F0)
      },
      'NEED_APPROVAL': {
        text: '等待确认',
        color: '#f59e0b'   // 警示橙 (RGB565: 0xFDC0)
      },
      'NEED_ANSWER': {
        text: '等待回答',
        color: '#8b5cf6'   // 交互紫 (RGB565: 0x8AEF)
      },
      'ERROR': {
        text: '异常中断',
        color: '#ef4444'   // 告警红 (RGB565: 0xF206)
      },
      'IDLE': {
        text: '待命中',
        color: '#7b889b'   // 待命灰 (RGB565: 0x7BEF)
      }
    };

    // 多任务翻滚轮播状态管理
    let activeTasks = [];
    let currentTaskIndex = 0;
    let rollInterval = null;

    function triggerTaskRoll() {
      if (activeTasks.length <= 1) {
        document.getElementById('screen-task-pager').hidden = true;
        return;
      }
      const pager = document.getElementById('screen-task-pager');
      const taskEl = document.getElementById('screen-task-title');
      pager.hidden = false;

      taskEl.classList.add('roll-out');
      setTimeout(() => {
        currentTaskIndex = (currentTaskIndex + 1) % activeTasks.length;
        const current = activeTasks[currentTaskIndex];
        taskEl.textContent = activeTasks.length > 1 ? `[${current.state}] ${current.title}` : current.title;
        pager.textContent = `${currentTaskIndex + 1}/${activeTasks.length} ↻`;
        taskEl.classList.remove('roll-out');
        taskEl.classList.add('roll-in');
        setTimeout(() => {
          taskEl.classList.remove('roll-in');
        }, 350);
      }, 350);
    }

    function syncActiveTasks(liveData, recentSessions) {
      const list = [];
      const liveTitle = String(liveData?.alert_title || '').trim();
      const liveState = String(liveData?.state || 'IDLE').toUpperCase();

      if (liveTitle && liveTitle !== '工作台就绪' && liveTitle !== '等待数据') {
        list.push({ title: liveTitle, state: liveState });
      }

      if (Array.isArray(recentSessions)) {
        recentSessions.forEach(s => {
          const st = String(s.status || '').toLowerCase();
          const title = String(s.title || '').trim();
          if ((st === 'working' || st === 'pending') && title && !list.some(item => item.title === title)) {
            list.push({
              title: title,
              state: st === 'working' ? 'RUNNING' : 'PENDING'
            });
          }
        });
      }

      activeTasks = list;
      const pager = document.getElementById('screen-task-pager');
      const taskEl = document.getElementById('screen-task-title');

      if (activeTasks.length === 0) {
        pager.hidden = true;
        taskEl.textContent = liveTitle || '工作台就绪';
        if (rollInterval) { clearInterval(rollInterval); rollInterval = null; }
      } else if (activeTasks.length === 1) {
        pager.hidden = true;
        taskEl.textContent = activeTasks[0].title;
        if (rollInterval) { clearInterval(rollInterval); rollInterval = null; }
      } else {
        pager.hidden = false;
        pager.textContent = `${currentTaskIndex + 1}/${activeTasks.length} ↻`;
        const current = activeTasks[currentTaskIndex] || activeTasks[0];
        taskEl.textContent = `[${current.state}] ${current.title}`;
        if (!rollInterval) {
          rollInterval = setInterval(triggerTaskRoll, 3800);
        }
      }
    }

    function renderHud(data, recentSessions = []) {
      if (!data) return;
      const state = String(data.state || 'IDLE').toUpperCase();
      const cfg = STATE_CONFIG[state] || STATE_CONFIG['IDLE'];

      document.getElementById('screen-time').textContent = data.time || new Date().toTimeString().split(' ')[0];
      document.getElementById('screen-state-text').textContent = cfg.text;
      
      // 指标栏左侧 Label 文本与颜色
      const metricState = document.getElementById('screen-metric-state');
      metricState.textContent = cfg.text;
      metricState.style.color = cfg.color;

      // 核心卡片左侧条与右上角圆点
      document.getElementById('screen-accent').style.background = cfg.color;
      const screenDot = document.getElementById('screen-dot');
      screenDot.style.background = cfg.color;
      screenDot.style.color = cfg.color;

      // 描述与用时
      document.getElementById('screen-desc').textContent = data.alert_desc || '正在监听系统工作流...';
      document.getElementById('screen-metric-duration').textContent = '用时 ' + (data.duration || '00:00');
      
      const sToken = String(data.session_tokens || data.tokens || '0').trim();
      const tToken = String(data.today_tokens || '0m').trim();
      document.getElementById('screen-metric-session-token').textContent = '本轮 ' + (sToken || '0');
      document.getElementById('screen-metric-today-token').textContent = '今日 ' + (tToken || '0m');

      // Wi-Fi 信号强度网络行
      const netRssi = Number(data.network_rssi ?? data.rssi ?? 0);
      const netStatus = data.network_status || (netRssi !== 0 ? 'Wi-Fi 在线' : 'Wi-Fi 离线');
      const netIp = data.network_ip || data.ip || '';
      if (netRssi !== 0) {
        document.getElementById('screen-net-wifi').innerHTML = `Wi-Fi <span style="color:#00f2fe;">${netRssi}dBm</span>`;
      } else {
        document.getElementById('screen-net-wifi').textContent = netStatus;
      }
      document.getElementById('screen-net-ip').textContent = netIp || (netStatus === 'Wi-Fi 离线' ? 'OFFLINE' : '--');

      const model = String(data.model || '').trim();
      const modelEl = document.getElementById('screen-model');
      modelEl.textContent = model ? `✦ ${model}` : '';
      modelEl.hidden = !model;

      // 多任务同步
      syncActiveTasks(data, recentSessions);

      // 审批按键提示
      const prompt = document.getElementById('screen-boot-prompt');
      if (state === 'NEED_APPROVAL') {
        prompt.style.display = 'inline-block';
        prompt.style.color = cfg.color;
      } else {
        prompt.style.display = 'none';
      }

      // 时间线与进度
      if (data.timeline && data.timeline.length > 0) {
        document.getElementById('screen-task-progress').textContent = data.timeline[0].dur || data.alert_desc || '进行中';
      } else {
        document.getElementById('screen-task-progress').textContent = data.alert_desc || '等待新的任务';
      }
    }

    // 从守护进程 5200 端口拉取数据
    async function fetchLiveStatus() {
      try {
        const res = await fetch('http://127.0.0.1:5200/api/bridge', { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          renderHud(json.live || {}, json.recent_sessions || []);
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch('http://127.0.0.1:5200/', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          renderHud(data);
          return;
        }
      } catch (e) {}

      try {
        const fallbackRes = await fetch('.workbuddy-ai/live_status.json', { cache: 'no-store' });
        if (fallbackRes.ok) {
          const data = await fallbackRes.json();
          renderHud(data);
        }
      } catch (err) {}
    }

    // 高频 500ms 刷新
    setInterval(fetchLiveStatus, 500);
    fetchLiveStatus();
  </script>
